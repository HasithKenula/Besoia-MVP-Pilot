services:
  postgres:
    image: postgres:16-alpine
    container_name: besoia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: besoia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - besoia-postgres-data:/var/lib/postgresql/data

volumes:
  besoia-postgres-data:
